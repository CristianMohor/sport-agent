name: Actualizar Fixture

on:
  # Todos los días a las 08:00 hora Chile (CLT = UTC-4 → 12:00 UTC)
  schedule:
    - cron: '0 12 * * *'

  # Ejecución manual desde GitHub → Actions → "Run workflow"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar scraper
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: node scraper.js

      - name: Commit y push si hubo cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fixture.json
          if git diff --cached --quiet; then
            echo "Sin cambios en fixture.json — nada que commitear"
          else
            git commit -m "chore: actualiza fixture $(date -u +%Y-%m-%d)"
            git push
            echo "✅ fixture.json pusheado"
          fi
